name: Deploy to Vercel (Prebuilt)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-to-Vercel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Bun (新增步骤：安装 Bun 环境)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: 5. Install dependencies
        run: pnpm install

      - name: 6. Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 7. Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 8. Verify Pulled Vercel Environment
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const file = '.vercel/.env.production.local';

          if (!fs.existsSync(file)) {
            console.error(`${file} does not exist`);
            process.exit(1);
          }

          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
          const env = new Map();

          for (const line of lines) {
            if (!line || line.startsWith('#')) continue;

            const index = line.indexOf('=');
            if (index === -1) continue;

            const key = line.slice(0, index);
            let value = line.slice(index + 1);

            if (
              (value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'"))
            ) {
              value = value.slice(1, -1);
            }

            env.set(key, value);
          }

          console.log(`pulled env keys: ${env.size}`);

          if (!env.has('KEY_VAULTS_SECRET')) {
            console.error('KEY_VAULTS_SECRET: missing key from pulled Vercel env');
            process.exit(1);
          }

          const keyVaultsSecret = env.get('KEY_VAULTS_SECRET');

          if (!keyVaultsSecret) {
            console.error('KEY_VAULTS_SECRET: present in pulled Vercel env, but value is empty');
            process.exit(1);
          }

          const decodedLength = Buffer.from(keyVaultsSecret, 'base64').length;

          console.log(`KEY_VAULTS_SECRET: present, valueLength=${keyVaultsSecret.length}, decodedBytes=${decodedLength}`);

          if (![16, 24, 32].includes(decodedLength)) {
            console.error('KEY_VAULTS_SECRET: invalid base64 AES key length');
            process.exit(1);
          }
          NODE

      - name: 9. Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 10. Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
